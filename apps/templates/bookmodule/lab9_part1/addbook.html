{% extends "layouts/base.html" %}

{% block title %} Lab 10 Part 1 - Add Book {% endblock title %}

{% block content %}
    <h2>Add a new book</h2>
    <form method="post">
        {% csrf_token %}
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>
        <br><br>
        <label for="author">Author</label>
        <input type="text" id="author" name="author" required>
        <br><br>
        <label for="price">Price</label>
        <input type="number" step="0.01" id="price" name="price" required>
        <br><br>
        <label for="edition">Edition</label>
        <input type="number" id="edition" name="edition" value="1" required>
        <br><br>
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" value="1" required>
        <br><br>
        <label for="rating">Rating</label>
        <input type="number" id="rating" name="rating" min="1" max="5" value="1" required>
        <br><br>
        <label for="pubdate">Publication date</label>
        <input type="date" id="pubdate" name="pubdate" required>
        <br><br>
        <label for="publisher">Publisher</label>
        <select id="publisher" name="publisher">
            <option value="">---------</option>
            {% for publisher in publishers %}
            <option value="{{ publisher.id }}">{{ publisher.name }}</option>
            {% endfor %}
        </select>
        <br><br>
        <button type="submit">Add Book</button>
    </form>
    <br>
    <a href="{% url 'books.lab9_part1_listbooks' %}">Back to books</a>
{% endblock content %}
