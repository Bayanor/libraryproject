{% extends "layouts/base.html" %}

{% block title %} Lab 11 Task 3 - Edit Textbook {% endblock title %}

{% block content %}
    <h2>Edit textbook #{{ textbook.id }}</h2>
    <img src="{{ textbook.cover.url }}" alt="{{ textbook.title }}" width="120">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Textbook</button>
    </form>
    <br>
    <a href="{% url 'books.lab11_task3_textbooks' %}">Back to textbooks</a>
{% endblock content %}
