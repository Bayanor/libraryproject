{% extends "layouts/base.html" %}

{% block title %} Lab 12 - Log in {% endblock title %}

{% block content %}
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" name="login">Log in</button>
    </form>
    <br>
    <a href="{% url 'users.register' %}">No account yet? Sign up</a>
{% endblock content %}
