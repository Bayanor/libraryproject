{% extends "layouts/base.html" %}

{% block title %} Lab 11 Task 2 - Edit Student {% endblock title %}

{% block content %}

        {{ form.as_p }}

    </form>

    <a href="{% url 'users.lab11_task2_students' %}">Back to students</a>
{% endblock content %}
